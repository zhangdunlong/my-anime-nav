<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f9f9f9" />
    <title>申请收录 - 🌸 实用导航</title>
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="./assets/images/favicon.svg" />
    <meta name="keywords" content="申请收录,网站收录,实用导航" />
    <meta name="description" content="提交您的优质网站，加入🌸实用导航站" />

    <link rel="stylesheet" href="./assets/css/bootstrap.min-4.3.1.css" type="text/css" media="all" />
    <link rel="stylesheet" href="./assets/css/custom-style.css" type="text/css" media="all" />
    <link rel="stylesheet" href="./assets/fontawesome-5.15.4/css/all.min.css" type="text/css" />

    <style>
        body {
            background: linear-gradient(135deg, #faf5ff 0%, #fdf2f8 50%, #ede9fe 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .submit-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(168,85,199,0.15);
        }

        .submit-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(168,85,199,0.15);
        }

        .submit-header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #2d1b69, #a855c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .submit-header p {
            color: #8b8b8b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d1b69;
            font-weight: 600;
        }

        .form-group label .required {
            color: #ec4899;
            margin-left: 3px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(168,85,199,0.15);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.8);
        }

        .form-control:focus {
            outline: none;
            border-color: #a855c7;
            box-shadow: 0 0 15px rgba(168,85,199,0.15);
        }

        .form-control.error {
            border-color: #ec4899;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .error-message {
            color: #ec4899;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a855c7, #ec4899);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(168,85,199,0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168,85,199,0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #a855c7;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: #ec4899;
            text-decoration: underline;
        }

        .success-message {
            background: linear-gradient(135deg, rgba(168,85,199,0.1), rgba(236,72,153,0.1));
            color: #6b3fa0;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(168,85,199,0.2);
        }

        .guidelines {
            background: linear-gradient(135deg, rgba(168,85,199,0.05), rgba(236,72,153,0.05));
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(168,85,199,0.1);
        }

        .guidelines h3 {
            font-size: 16px;
            color: #2d1b69;
            margin-bottom: 10px;
        }

        .guidelines ul {
            margin: 0;
            padding-left: 20px;
        }

        .guidelines li {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }
    </style>
</head>

<body class="io-grey-mode">
    <div class="submit-container">
        <div class="submit-header">
            <h1><i class="fas fa-paper-plane"></i> 网址提交</h1>
            <p>提交您的优质网站，我们将在审核后收录到网址导航中</p>
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> 提交成功！我们会尽快审核您的网站。
        </div>

        <div class="guidelines">
            <h3><i class="fas fa-info-circle"></i> 提交须知</h3>
            <ul>
                <li>请确保网站内容合法、健康，符合相关法律法规</li>
                <li>网站应正常访问，不含恶意代码或病毒</li>
                <li>提供真实有效的网站信息，便于我们审核</li>
                <li>我们会在3-5个工作日内完成审核，审核结果将通过邮件通知</li>
            </ul>
        </div>

        <form id="submitForm">
            <div class="form-group">
                <label for="siteName">
                    网站名称<span class="required">*</span>
                </label>
                <input type="text" id="siteName" name="siteName" class="form-control"
                       placeholder="请输入网站名称" maxlength="50" required>
                <div class="error-message" id="siteNameError">请输入网站名称</div>
            </div>

            <div class="form-group">
                <label for="siteUrl">
                    网站地址<span class="required">*</span>
                </label>
                <input type="url" id="siteUrl" name="siteUrl" class="form-control"
                       placeholder="https://example.com" required>
                <div class="error-message" id="siteUrlError">请输入正确的网址格式</div>
            </div>

            <div class="form-group">
                <label for="category">
                    网站分类<span class="required">*</span>
                </label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">请选择分类</option>
                    <option value="常用工具">常用工具</option>
                    <option value="科研办公">科研办公</option>
                    <option value="开发设计">开发设计</option>
                    <option value="效率办公">效率办公</option>
                    <option value="社交媒体">社交媒体</option>
                    <option value="资源下载">资源下载</option>
                    <option value="生活服务">生活服务</option>
                    <option value="学习教育">学习教育</option>
                    <option value="其他">其他</option>
                </select>
                <div class="error-message" id="categoryError">请选择网站分类</div>
            </div>

            <div class="form-group">
                <label for="description">
                    网站描述<span class="required">*</span>
                </label>
                <textarea id="description" name="description" class="form-control"
                          placeholder="简要描述网站的主要功能和特点"
                          maxlength="200" required></textarea>
                <div class="char-count">
                    <span id="descCount">0</span>/200
                </div>
                <div class="error-message" id="descriptionError">请输入网站描述</div>
            </div>

            <div class="form-group">
                <label for="keywords">
                    关键词
                </label>
                <input type="text" id="keywords" name="keywords" class="form-control"
                       placeholder="用逗号分隔，如：工具,在线,免费" maxlength="100">
            </div>

            <div class="form-group">
                <label for="email">
                    联系邮箱<span class="required">*</span>
                </label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="用于接收审核结果通知" required>
                <div class="error-message" id="emailError">请输入正确的邮箱地址</div>
            </div>

            <div class="form-group">
                <label for="contact">
                    联系方式
                </label>
                <input type="text" id="contact" name="contact" class="form-control"
                       placeholder="QQ、微信或其他联系方式（选填）" maxlength="50">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-paper-plane"></i> 提交网站
            </button>
        </form>

        <div class="back-home">
            <a href="../"><i class="fas fa-home"></i> 返回首页</a>
        </div>
    </div>

    <script src="./assets/js/jquery.min-3.2.1.js"></script>
    <script src="commit.js?v=20260705"></script>
</body>
</html>
