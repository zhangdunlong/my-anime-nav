<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
    <title>404 - 页面找不到了 🌸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #2d1b69, #6b3fa0, #a855c7, #ec4899);
            background-size: 300% 300%;
            animation: gradientBG 8s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "SF Pro SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .emoji { font-size: 80px; display: block; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 { font-size: 72px; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.3); margin-bottom: 10px; }
        p { font-size: 20px; color: rgba(255,255,255,0.85); margin-bottom: 30px; }
        a {
            display: inline-block;
            padding: 14px 40px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        a:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🥺</span>
        <h1>404</h1>
        <p>呜~ 页面好像走丢了...<br>要不回首页看看？</p>
        <a href="./">🌸 返回首页</a>
    </div>
</body>
</html>
